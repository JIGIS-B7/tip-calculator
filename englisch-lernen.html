<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Englisch lernen — 3D-Druck, PC & Coding (Komplett)</title>
<style>
  :root{
    --bg:#0f1220; --card:#1a1f35; --card2:#222842; --accent:#5b8cff;
    --accent2:#8b5cff; --txt:#eef1ff; --muted:#9aa3c7; --ok:#36d399; --bad:#ff5c7a;
    --border:#2c3358;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0f1220,#161a30); color:var(--txt); padding-bottom:40px;}
  header{padding:20px 16px 12px; text-align:center;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px;}
  .tabs{display:flex; gap:8px; padding:10px 12px; overflow-x:auto;}
  .tab{flex:0 0 auto; padding:9px 14px; border-radius:999px; background:var(--card);
    border:1px solid var(--border); color:var(--txt); font-size:14px; cursor:pointer;}
  .tab.active{background:linear-gradient(90deg,var(--accent),var(--accent2)); border-color:transparent; font-weight:600;}
  .wrap{padding:8px 14px; max-width:680px; margin:0 auto;}
  .modes{display:flex; gap:8px; margin:6px 0 14px;}
  .modebtn{flex:1; padding:11px; border-radius:12px; background:var(--card); border:1px solid var(--border);
    color:var(--txt); font-size:14px; font-weight:600; cursor:pointer;}
  .modebtn.active{background:var(--card2); border-color:var(--accent);}
  input.search{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card); color:var(--txt); font-size:15px; margin-bottom:12px;}
  .flash{perspective:1200px; margin:0 auto;}
  .fcard{position:relative; width:100%; min-height:230px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .5s; }
  .fcard.flipped{transform:rotateY(180deg);}
  .face{position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
    padding:22px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; border:1px solid var(--border);}
  .front{background:linear-gradient(160deg,var(--card),var(--card2));}
  .back{background:linear-gradient(160deg,#1d2b4a,#243a63); transform:rotateY(180deg);}
  .big{font-size:28px; font-weight:700; margin:6px 0;}
  .ipa{color:var(--accent); font-size:18px; margin:4px 0;}
  .de{font-size:16px; color:var(--txt); margin-top:6px;}
  .hint{color:var(--muted); font-size:12px; margin-top:14px;}
  .navrow{display:flex; gap:8px; align-items:center; margin:14px 0;}
  .navbtn{flex:1; padding:13px; border-radius:12px; border:none; font-size:16px; font-weight:700; cursor:pointer; color:#fff;
    background:var(--card2); border:1px solid var(--border);}
  .navbtn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2)); border:none;}
  .counter{color:var(--muted); font-size:13px; text-align:center; margin-bottom:6px;}
  .speak{margin-top:8px; padding:9px 16px; border-radius:999px; border:1px solid var(--accent);
    background:transparent; color:var(--accent); font-size:14px; cursor:pointer;}
  .row{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .row .en{font-weight:700; font-size:16px;}
  .row .ipa2{color:var(--accent); font-size:13px;}
  .row .de2{color:var(--muted); font-size:13px; margin-top:2px;}
  .row .sp{flex:0 0 auto; background:transparent; border:1px solid var(--border); color:var(--accent);
    border-radius:50%; width:40px; height:40px; font-size:18px; cursor:pointer;}
  .quizq{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; text-align:center;}
  .quizq .q{font-size:14px; color:var(--muted);}
  .quizq .qword{font-size:24px; font-weight:700; margin:10px 0 18px;}
  .opt{display:block; width:100%; padding:14px; margin:8px 0; border-radius:12px; background:var(--card2);
    border:1px solid var(--border); color:var(--txt); font-size:15px; cursor:pointer; text-align:left;}
  .opt.correct{background:rgba(54,211,153,.2); border-color:var(--ok);}
  .opt.wrong{background:rgba(255,92,122,.2); border-color:var(--bad);}
  .score{text-align:center; color:var(--muted); margin:12px 0;}
  .footer{text-align:center; color:var(--muted); font-size:12px; padding:24px 16px 0;}
</style>
</head>

<header>
  <h1>🇬🇧 Englisch für Technik — Komplett</h1>
  <div class="sub" id="totalSub">3D-Druck · PC · Programmieren — mit Aussprache 🔊</div>
</header>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <div class="modes">
    <button class="modebtn active" data-mode="cards">🃏 Karten</button>

    <button class="modebtn" data-mode="quiz">🎯 Quiz</button>

    <div class="flash">

        </div>
        <div class="face back">
          <div class="de" id="fBack"></div>
          <div class="hint">Tippen zum Zurückdrehen</div>
        </div>
      </div>
    </div>
    <div class="navrow">
      <button class="navbtn" id="prev">◀︎ Zurück</button>
      <button class="navbtn primary" id="next">Weiter ▶︎</button>
    </div>
  </div>

  <div id="list" style="display:none">
    <input class="search" id="search" placeholder="🔍 Suchen (deutsch oder englisch)...">
    <div id="listBody"></div>
  </div>

  <div id="quiz" style="display:none">
    <div class="score" id="quizScore"></div>
    <div class="quizq">

      <div class="qword" id="quizWord"></div>

    </div>
    <div class="navrow"><button class="navbtn primary" id="quizNext" style="display:none">Nächste Frage ▶︎</button></div>
  </div>
</div>

function speakText(s){
  let t = s.replace(/\(.*?\)/g,'').replace(/—.*$/,'').split('/')[0].replace(/[^a-zA-Z .'-]/g,'').trim();
  if(!t) return;
  if(!('speechSynthesis' in window)) { alert('Dein Browser kann keine Aussprache abspielen.'); return; }
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US'; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));
  if(v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

let cat = "3D-Druck", mode = "cards", idx = 0;

// total count
let total=0; Object.values(DATA).forEach(a=>total+=a.filter(x=>x[1]!=="").length);
document.getElementById('totalSub').textContent = `${total} Begriffe · 3D-Druck · PC · Coding · mit Aussprache 🔊`;

const tabsEl = document.getElementById('tabs');
Object.keys(DATA).forEach(c=>{
  const n=DATA[c].filter(x=>x[1]!=="").length;
  const b=document.createElement('button'); b.className='tab'+(c===cat?' active':''); b.textContent=`${c} (${n})`;
  b.onclick=()=>{cat=c; idx=0; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b)); render();};
  tabsEl.appendChild(b);
});
document.querySelectorAll('.modebtn').forEach(b=>{
  b.onclick=()=>{mode=b.dataset.mode; document.querySelectorAll('.modebtn').forEach(x=>x.classList.toggle('active',x===b)); render();};
});

function render(){
  document.getElementById('cards').style.display = mode==='cards'?'block':'none';
  document.getElementById('list').style.display  = mode==='list'?'block':'none';
  document.getElementById('quiz').style.display  = mode==='quiz'?'block':'none';
  if(mode==='cards') renderCard();
  if(mode==='list')  renderList();
  if(mode==='quiz')  newQuiz();
}

const fcard=document.getElementById('fcard');
fcard.onclick=()=>fcard.classList.toggle('flipped');
function renderCard(){
  const arr=DATA[cat]; const it=arr[idx];
  fcard.classList.remove('flipped');
  document.getElementById('fFront').textContent=it[0];
  document.getElementById('fIpa').textContent=it[1]?'['+it[1]+']':'';
  document.getElementById('fBack').textContent=it[2];
  document.getElementById('counter').textContent=`${cat} — Karte ${idx+1} / ${arr.length}`;
}
document.getElementById('fSpeak').onclick=(e)=>{e.stopPropagation(); speakText(DATA[cat][idx][0]);};
document.getElementById('next').onclick=()=>{idx=(idx+1)%DATA[cat].length; renderCard();};
document.getElementById('prev').onclick=()=>{idx=(idx-1+DATA[cat].length)%DATA[cat].length; renderCard();};

function renderList(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const body=document.getElementById('listBody'); body.innerHTML='';
  DATA[cat].filter(it=>it[1]!=="").filter(it=>it[0].toLowerCase().includes(q)||it[2].toLowerCase().includes(q)).forEach(it=>{
    const r=document.createElement('div'); r.className='row';
    const left=document.createElement('div');
    left.innerHTML=`<div class="en"></div><div class="ipa2"></div><div class="de2"></div>`;
    left.querySelector('.en').textContent=it[0];
    left.querySelector('.ipa2').textContent='['+it[1]+']';
    left.querySelector('.de2').textContent=it[2];
    r.appendChild(left);
    const sp=document.createElement('button'); sp.className='sp'; sp.textContent='🔊';
    sp.onclick=()=>speakText(it[0]); r.appendChild(sp); body.appendChild(r);
  });
}
document.getElementById('search').oninput=renderList;

let qScore=0, qTotal=0;
function newQuiz(){
  const arr=DATA[cat].filter(x=>x[1]!=="");
  const correct=arr[Math.floor(Math.random()*arr.length)];
  const opts=[correct];
  while(opts.length<4){ const c=arr[Math.floor(Math.random()*arr.length)]; if(!opts.includes(c)) opts.push(c); }
  opts.sort(()=>Math.random()-0.5);
  document.getElementById('quizWord').textContent=correct[0];
  document.getElementById('quizScore').textContent=`Punkte: ${qScore} / ${qTotal}`;
  const box=document.getElementById('quizOpts'); box.innerHTML='';
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o[2];
    b.onclick=()=>checkQuiz(b,o,correct); box.appendChild(b);
  });
  document.getElementById('quizNext').style.display='none';
  speakText(correct[0]);
}
function checkQuiz(btn,chosen,correct){
  qTotal++;
  document.querySelectorAll('.opt').forEach(b=>{ b.style.pointerEvents='none';
    if(b.textContent===correct[2]) b.classList.add('correct'); });
  if(chosen===correct){ qScore++; } else { btn.classList.add('wrong'); }
  document.getElementById('quizScore').textContent=`Punkte: ${qScore} / ${qTotal}`;
  document.getElementById('quizNext').style.display='block';
}
document.getElementById('quizNext').onclick=newQuiz;

if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{}; }
render();
